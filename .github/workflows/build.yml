name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install buildozer cython==0.29.33
      - name: Build
        run: |
          buildozer init || true
          sed -i 's/title = My Application/title = Tecno Freitas/' buildozer.spec
          sed -i 's/package.name = myapp/package.name = tecnofreitas/' buildozer.spec
          buildozer -v android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-tecno-freitas
          path: bin/*.apk
