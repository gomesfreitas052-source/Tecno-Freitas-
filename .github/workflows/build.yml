
name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Instalar Python e Java
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev automake

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.34

      - name: Compilar APK
        run: buildozer android debug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: TECNO-FREITAS-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
          
