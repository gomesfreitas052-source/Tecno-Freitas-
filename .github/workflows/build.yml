name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip libffi-dev libssl-dev libbz2-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.36
      - name: Accept Android licenses
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platforms;android-33" "platform-tools" || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: Create buildozer.spec
        run: |
          rm -f buildozer.spec
          cat > buildozer.spec << 'EOF'
          [app]
          title = Tecno Freitas
          package.name = tecnofreitas
          package.domain = com.tecno.freitas
          source.dir = .
          source.include_exts = py,png,jpg,kv,json
          version = 0.1
          requirements = python3,kivy
          orientation = portrait
          [buildozer]
          log_level = 2
          warn_on_root = 1
          [app:android]
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.sdk_path = /usr/local/lib/android/sdk
          android.accept_sdk_license_agreement = True
          p4a.build_tools_version = 33.0.2
          EOF
          cat buildozer.spec
      - name: Build APK
        run: buildozer -v android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TecnoFreitas-APK
          path: bin/*.apk
