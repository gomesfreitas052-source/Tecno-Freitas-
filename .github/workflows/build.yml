name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip libffi-dev libssl-dev
          pip install cython==0.29.36 buildozer
          yes | sdkmanager --licenses
          sdkmanager "build-tools;33.0.2" "platforms;android-33" "platform-tools"
      - name: Create spec
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = Tecno Freitas
          package.name = tecnofreitas
          package.domain = com.tecno.freitas
          source.dir = .
          source.include_exts = py,png,jpg,kv
          version = 0.1
          requirements = python3,kivy
          orientation = portrait
          [buildozer]
          log_level = 2
          [app:android]
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.sdk_path = /usr/local/lib/android/sdk
          android.accept_sdk_license_agreement = True
          p4a.build_tools_version = 33.0.2
          EOF
          cat buildozer.spec
      - name: Build APK
        run: buildozer -v android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TecnoFreitas-APK
          path: bin/*.apk
