name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest
      options: --user user
    steps:
      - uses: actions/checkout@v4
      - name: Fix root check and build
        run: |
          whoami
          pwd
          ls -la
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TecnoFreitas-APK
          path: bin/*.apk
