name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest
    steps:
      - uses: actions/checkout@v4
      - name: Create spec and Build
        run: |
          cd $GITHUB_WORKSPACE
          pwd
          ls -la
          # Se não tiver spec, cria um
          if [ ! -f buildozer.spec ]; then
            echo "Criando buildozer.spec..."
            cat > buildozer.spec << 'EOF'
          [app]
          title = TecnoFreitas
          package.name = tecnofreitas
          package.domain = com.gomes.tecnofreitas
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,json
          version = 0.1
          requirements = python3,kivy==2.3.0,Pillow
          orientation = portrait
          fullscreen = 0
          android.permissions = INTERNET
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.accept_sdk_license_agreement = True

          [buildozer]
          log_level = 2
          warn_on_root = 0

          [app:storage]
          EOF
          fi
          cat buildozer.spec
          echo "Patchando root check..."
          find / -type f -name "__init__.py" -path "*buildozer*" 2>/dev/null | xargs sed -i 's/self.check_root()/pass # self.check_root()/g' || true
          echo "Construindo..."
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TecnoFreitas-APK
          path: bin/*.apk
