name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip libffi-dev libssl-dev
          pip install buildozer cython==0.29.36
          mkdir -p ~/.android
          mkdir -p ~/.android/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.android/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.android/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1059b8ea3b9b4" >> ~/.android/licenses/android-sdk-license
          echo "y" | sdkmanager --licenses || true
      - name: Create spec
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = Tecno Freitas
          package.name = tecnofreitas
          package.domain = com.tecno.freitas
          source.dir = .
          source.include_exts = py,png,jpg,kv
          version = 0.1
          requirements = python3,kivy
          orientation = portrait
          [buildozer]
          log_level = 2
          warn_on_root = 1
          [app:android]
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.accept_sdk_license_agreement = True
          p4a.build_tools_version = 33.0.2
          EOF
      - name: Build APK
        run: |
          yes | buildozer -v android debug || true
          # aceita a licenca na pasta do buildozer e tenta de novo
          BUILD_SDK=~/.buildozer/android/platform/android-sdk
          if [ -d "$BUILD_SDK/cmdline-tools" ]; then
            yes | $BUILD_SDK/cmdline-tools/latest/bin/sdkmanager --licenses || true
            $BUILD_SDK/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" || true
          fi
          buildozer -v android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TecnoFreitas-APK
          path: bin/*.apk
