name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Buildozer Action
        uses: diggy/buildozer-action@v1
        with:
          python-version: 3.10
          buildozer-cmd: buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TecnoFreitas-APK
          path: bin/*.apk
