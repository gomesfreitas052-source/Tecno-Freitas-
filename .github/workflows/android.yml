name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Liberar espaço
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force || true
          df -h

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Preparar
        run: |
          sudo apt install -y zip unzip libffi-dev libssl-dev -y
          pip install Cython==0.29.36 buildozer==1.5.0 python-for-android==2024.1.21 sh==1.14.3

      - name: Compilar
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = Tecno Freitas
          package.name = tecnofreitas
          package.domain = com.gomes.tecnofreitas
          source.dir = .
          version = 1.8
          requirements = python3,kivy
          orientation = portrait
          android.permissions = INTERNET
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.accept_sdk_license_agreement = True
          [buildozer]
          log_level = 1
          EOF

          # Licenças
          mkdir -p $HOME/.android && touch $HOME/.android/repositories.cfg
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1059b8ea4b324" >> $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "d975f751698a77b662f1254ddbeed3901e976f5a" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

          # 1ª tentativa - vai baixar SDK e NDK e falhar no sdkmanager (igual seu print)
          buildozer android debug || true

          echo "=== CRIANDO LINK DO SDKMANAGER ==="
          # Acha onde o sdkmanager foi baixado
          REAL_SDK=$(find $HOME/.buildozer -name "sdkmanager" -type f 2>/dev/null | head -n1)
          echo "sdkmanager real: $REAL_SDK"
          ls -lh $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/ || true
          
          # Cria a pasta antiga que o buildozer procura e linka
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/tools/bin
          if [ -n "$REAL_SDK" ]; then
            ln -sf $REAL_SDK $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
            chmod +x $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          fi
          
          # Instala o 37 na marra
          yes | $REAL_SDK --sdk_root=$HOME/.buildozer/android/platform/android-sdk --install "build-tools;37.0.0" "build-tools;33.0.2" "platform-tools" || true
          yes | $REAL_SDK --sdk_root=$HOME/.buildozer/android/platform/android-sdk --licenses || true

          # 2ª tentativa - agora vai
          buildozer android debug

      - uses: actions/upload-artifact@v4
        with:
          name: TecnoFreitas-APK-V18
          path: bin/*.apk
