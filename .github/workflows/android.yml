name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Instalar tudo + licenças
        run: |
          sudo apt update && sudo apt install -y libffi-dev libssl-dev
          pip install Cython==0.29.36 buildozer==1.5.0 python-for-android==2024.1.21
          yes | sdkmanager --licenses || true
          mkdir -p $HOME/.android && touch $HOME/.android/repositories.cfg
      - name: Compilar
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = Tecno Freitas
          package.name = tecnofreitas
          package.domain = com.gomes.tecnofreitas
          source.dir = .
          version = 0.8
          requirements = python3,kivy
          orientation = portrait
          android.permissions = INTERNET
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.sdk = 33
          android.accept_sdk_license_agreement = True
          [buildozer]
          log_level = 2
          EOF
          yes | sdkmanager --licenses || true
          buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: TecnoFreitas-FIX-37
          path: bin/*.apk
