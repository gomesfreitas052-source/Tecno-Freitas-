name: build
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependências
        run: |
          sudo apt update
          sudo apt install -y python3-pip zip unzip libffi-dev libssl-dev
          pip3 install --upgrade pip
          pip3 install cython==0.29.36
          pip3 install https://github.com/kivy/buildozer/archive/master.zip
          pip3 install https://github.com/kivy/python-for-android/archive/develop.zip

      - name: Criar buildozer.spec
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = Tecno Freitas
          package.name = tecnofreitas
          package.domain = com.gomes.tecnofreitas
          source.dir = .
          version = 0.3
          requirements = python3,kivy,pyjnius
          orientation = portrait
          android.permissions = INTERNET
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.accept_sdk_license_agreement = True
          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF

      - name: Compilar APK
        run: |
          export JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          buildozer android debug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: TecnoFreitas-V3-FINAL
          path: bin/*.apk
