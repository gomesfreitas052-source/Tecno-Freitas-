name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Fix definitivo Build-Tools 37
        run: |
          sudo apt update && sudo apt install -y zip unzip libffi-dev libssl-dev
          pip install Cython==0.29.36 buildozer==1.5.0 python-for-android==2024.1.21 sh==1.14.3
          # 1. Cria licenças em TODOS os lugares possíveis
          for d in "$HOME/.android" "$ANDROID_HOME" "$HOME/.buildozer/android/platform/android-sdk"; do
            mkdir -p $d/licenses
            echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $d/licenses/android-sdk-license
            echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $d/licenses/android-sdk-license
            echo "24333f8a63b6825ea9c5514f83c1059b8ea4b324" >> $d/licenses/android-sdk-license
            echo "d975f751698a77b662f1254ddbeed3901e976f5a" > $d/licenses/android-sdk-preview-license
            echo "y" > $d/licenses/android-googletv-license || true
          done
          # 2. Cria WRAPPER que responde Y sempre
          mkdir -p /tmp/wrapper
          cat > /tmp/wrapper/fix.sh << 'EOS'
          #!/bin/bash
          for bin in $(find $HOME -name "sdkmanager" -type f 2>/dev/null; find $ANDROID_HOME -name "sdkmanager" -type f 2>/dev/null); do
            if [ -f "$bin" ] && [ ! -f "$bin.real" ]; then
              mv "$bin" "$bin.real"
              echo -e "#!/bin/bash\nyes | $bin.real \"\$@\"" > "$bin"
              chmod +x "$bin"
            fi
          done
          EOS
          chmod +x /tmp/wrapper/fix.sh
          # Roda o fix antes e depois também vamos rodar dentro do buildozer
          /tmp/wrapper/fix.sh || true

      - name: Compilar
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = Tecno Freitas
          package.name = tecnofreitas
          package.domain = com.gomes.tecnofreitas
          source.dir = .
          version = 1.2
          requirements = python3,kivy
          orientation = portrait
          android.permissions = INTERNET
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.accept_sdk_license_agreement = True
          [buildozer]
          log_level = 2
          EOF
          # Instala um patch no python do buildozer pra aceitar tudo
          SITE=$(python3 -c "import site; print(site.getsitepackages()[0])")
          echo "Patching $SITE/buildozer/targets/android.py"
          sed -i "s/Accept? (y\/N):/Accept? (y\/N): y/g" $SITE/buildozer/targets/android.py || true
          # Roda o fix de novo caso o buildozer baixe um novo sdkmanager
          (sleep 30 && /tmp/wrapper/fix.sh) &
          buildozer android debug

      - uses: actions/upload-artifact@v4
        with:
          name: TecnoFreitas-V12-WRAPPER-FIX
          path: bin/*.apk
