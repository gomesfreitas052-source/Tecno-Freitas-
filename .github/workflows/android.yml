name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Liberar espaço
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Preparar
        run: |
          sudo apt update && sudo apt install -y zip unzip libffi-dev libssl-dev
          pip install Cython==0.29.36 buildozer==1.5.0 python-for-android==2024.1.21 sh==1.14.3

      - name: Compilar
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = Tecno Freitas
          package.name = tecnofreitas
          package.domain = com.gomes.tecnofreitas
          source.dir = .
          version = 1.6
          requirements = python3,kivy
          orientation = portrait
          android.permissions = INTERNET
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.accept_sdk_license_agreement = True
          [buildozer]
          log_level = 1
          EOF

          # 1. Licenças em todos os lugares
          mkdir -p $HOME/.android
          touch $HOME/.android/repositories.cfg
          for d in "$HOME/.android" "$HOME/.buildozer/android/platform/android-sdk"; do
            mkdir -p $d/licenses
            echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $d/licenses/android-sdk-license
            echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $d/licenses/android-sdk-license
            echo "24333f8a63b6825ea9c5514f83c1059b8ea4b324" >> $d/licenses/android-sdk-license
            echo "d975f751698a77b662f1254ddbeed3901e976f5a" > $d/licenses/android-sdk-preview-license
          done

          # 2. Instala o 37 usando o sdkmanager do sistema, mas instalando na pasta do buildozer
          ls $ANDROID_HOME/cmdline-tools/latest/bin/
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/.buildozer/android/platform/android-sdk --install "build-tools;37.0.0" "build-tools;33.0.2" "platform-tools" "platforms;android-33" || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/.buildozer/android/platform/android-sdk --licenses || true

          buildozer android debug

      - uses: actions/upload-artifact@v4
        with:
          name: TecnoFreitas-APK-V16
          path: bin/*.apk
