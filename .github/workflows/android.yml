name: build-android
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Python e Java
        uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Instalar dependências
        run: |
          sudo apt update
          sudo apt install -y libffi-dev libssl-dev libbz2-dev zip unzip
          pip install cython==0.29.36 buildozer
          pip install https://github.com/kivy/python-for-android/archive/develop.zip
      - name: Instalar Buildozer
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = Tecno Freitas
          package.name = tecnofreitas
          package.domain = com.gomes.tecnofreitas
          source.dir = .
          version = 0.2
          requirements = python3,kivy,pyjnius,Pillow
          orientation = portrait
          android.api = 33
          android.minapi = 21
          android.ndk = 28c
          android.accept_sdk_license_agreement = True
          [buildozer]
          log_level = 2
          EOF
      - name: Compilar APK
        run: yes | buildozer android debug
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: TecnoFreitas-V2
          path: bin/*.apk
